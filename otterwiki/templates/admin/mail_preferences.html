{# vim: set et ts=8 sts=4 sw=4 ai ft=jinja.html: #}
{% extends "settings.html" %}
{% block content %}
<div class="card m-auto m-lg-20" id="mail_preferences">
<div class="mw-full">
<form action="{{ url_for("admin_mail_preferences") }}" method="POST" autocomplete="off">
<h3 class="card-title">{{ t.mail_preferences_title }}</h3>
{##}
  <div class="form-group">
    <label for="mail_sender" class="required">{{ t.mail_sender_label }}</label>
    <input name="mail_sender" type="text" class="form-control" id="mail_sender" value="{{ config.MAIL_DEFAULT_SENDER}}">
    {# <div class="form-text"> ...  </div> #}
  </div>
{##}
  <div class="form-group">
    <label for="mail_server" class="required">{{ t.mail_server_label }}</label>
    <input name="mail_server" type="text" class="form-control" id="mail_server" value="{{ config.MAIL_SERVER}}">
    {# <div class="form-text"> ...  </div> #}
  </div>
{##}
  <div class="form-group">
    <label for="mail_port">{{ t.mail_port_label }}</label>
    <input name="mail_port" type="text" class="form-control" placeholder="{{ t.mail_port_placeholder }}" id="mail_port" value="{{ config.MAIL_PORT }}">
    {# <div class="form-text"> ...  </div> #}
  </div>
{##}
  <div class="form-group">
    <label for="mail_username">{{ t.mail_username_label }}</label>
    <input name="mail_username" type="text" class="form-control" autocomplete="off" id="mail_username" value="{{ config.MAIL_USERNAME or "" }}">
    {# <div class="form-text"> ...  </div> #}
  </div>
{##}
  <div class="form-group">
    <label for="mail_password">{{ t.mail_password_label }}</label>
    <input name="mail_password" type="password" class="form-control" autocomplete="off" id="mail_password" placeholder="{{ config.MAIL_PASSWORD| default("", true) | length * "·" }}" value="">
    {# <div class="form-text"> ...  </div> #}
  </div>
{##}
  <div class="form-group">
      <label for="mail_security" class="required">{{ t.mail_security_label }}</label>
      <select class="form-control" id="mail_security" name="mail_security">
        <option value="">{{ t.mail_security_not_encrypted }}</option>
        <option {% if config["MAIL_USE_TLS"] -%} selected="selected" {%- endif %} value="tls">{{ t.mail_security_tls }}</option>
        <option {% if config["MAIL_USE_SSL"] -%} selected="selected" {%- endif %} value="ssl">{{ t.mail_security_ssl }}</option>
    </select>
  </div>
{##}
  <div class="mt-10">
    <input class="btn btn-primary" name="update_mail_preferences" type="submit" value="{{ t.mail_save_btn }}">
  </div>
{##}
<hr class="my-15"/>
<h3 class="card-title">{{ t.mail_test_title }}</h3>
{##}
  <div class="form-group">
    <label for="mail_recipient" class="required">{{ t.mail_test_recipient_label }}</label>
    <input name="mail_recipient" type="text" class="form-control" id="mail_recipient" placeholder="{{ current_user.email }}">
    {# <div class="form-text"> ...  </div> #}
  </div>
{##}
  <div class="mt-10">
    <input class="btn" name="test_mail_preferences" type="submit" value="{{ t.mail_send_test_btn }}">
  </div>
</form>
</div>
</div>{# card #}
{% endblock %}
