{# vim: set et ts=8 sts=4 sw=4 ai: #}
{% extends "form.html" %}
{% block formcontent %}
<form action="{{url_for("revert", revision=revision)}}" method="POST" class="form-inline">{# class="w-400 mw-full" <!-- w-400 = width: 40rem (400px), mw-full = max-width: 100% --> #}
  <div class="form-group">
    <label for="message" class="required">{{ t.revert_message_label }}</label>
    <input type="text" class="form-control" name="message" id="message" placeholder="{{ t.revert_message_placeholder.format(revision=revision) }}">
  </div>
  <div class="form-group">
    <div class="form-text">
        <strong>{{ t.revert_hint }}</strong>&nbsp;{{ t.revert_hint_text }}</div>
  </div>
  <input class="btn btn-primary" type="submit" value="{{ t.revert_submit }}">
</form>
{% endblock %}
